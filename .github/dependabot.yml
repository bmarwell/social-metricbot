version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "io.github.bmarwell.social.metricbot:common"
      - dependency-name: "io.github.bmarwell.social.metricbot:social-metricbot-mastodon"
      - dependency-name: "io.github.bmarwell.social.metricbot:social-metricbot-bsky-client"
      - dependency-name: "io.github.bmarwell.social.metricbot:metricbot-db"
    groups:
      jakarta-javax-apis:
        patterns:
          - "jakarta.*:*"
          - "javax.*:*"
      microprofile-apis:
        patterns:
          - "org.eclipse.microprofile.*:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "io.openliberty.tools:*"
      monthly-batch-maven:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      monthly-batch-actions:
        patterns:
          - "*"
